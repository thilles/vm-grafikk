services:
  vm-scoreboard:
    build: .
    container_name: vm-scoreboard
    ports:
      - "8000:8000"
    environment:
      # Gratis API-nøkkel fra https://www.football-data.org/client/register
      - FOOTBALL_DATA_TOKEN=${FOOTBALL_DATA_TOKEN:-}
      # Valgfritt: publisert CSV-lenke til Google Sheet (Fil -> Del -> Publiser på nettet -> CSV)
      - SHEET_CSV_URL=${SHEET_CSV_URL:-}
      # Kamphøydepunkter (mål/kort + NRK-videoklipp) hentes fra NRKs åpne NIFS-API – ingen nøkkel.
      # Valgfritt: Claude-nøkkel for «spør på norsk» → SPARQL på /graf (kg_nlq.py)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REFRESH_MINUTES=${REFRESH_MINUTES:-10}
    volumes:
      - ./data:/data
    restart: unless-stopped
