services:
  vm-scoreboard:
    build: .
    container_name: vm-scoreboard
    ports:
      - "8000:8000"
    environment:
      # Gratis API-nøkkel fra https://www.football-data.org/client/register
      - FOOTBALL_DATA_TOKEN=${FOOTBALL_DATA_TOKEN:-}
      # Valgfritt: publisert CSV-lenke til Google Sheet (Fil -> Del -> Publiser på nettet -> CSV)
      - SHEET_CSV_URL=${SHEET_CSV_URL:-}
      # Valgfritt: api-sports-nøkkel for mål/kort pr ferdig kamp (https://www.api-football.com)
      - APISPORTS_KEY=${APISPORTS_KEY:-}
      # Valgfritt: YouTube Data API-nøkkel + spilleliste for høydepunkt-video pr kamp
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_PLAYLIST_ID=${YOUTUBE_PLAYLIST_ID:-PLBRLtDhTHh5o}
      - REFRESH_MINUTES=${REFRESH_MINUTES:-10}
    volumes:
      - ./data:/data
    restart: unless-stopped
